services:
  - type: web
    name: rouanet-concilia-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Cole a Connection String do Supabase aqui
      - key: SUPABASE_JWT_SECRET
        sync: false # Cole o JWT Secret do Supabase aqui
      - key: APP_ENV
        value: production
      - key: GOOGLE_API_KEY
        sync: false
