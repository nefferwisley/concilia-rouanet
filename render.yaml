services:
  - type: web
    # Este é o único serviço público do produto: SPA React + API FastAPI.
    # Não usar o serviço `rouanetconcilia-backend`, que pertence a outro
    # repositório e publica somente a API legada.
    name: concilia-rouanet-1961
    runtime: python
    plan: free
    buildCommand: "npm ci && npm run lint && npm test -- --run && npm run build && pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ENV
        value: "production"
      - key: PYTHON_VERSION
        value: "3.11.11"

