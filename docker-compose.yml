services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: rouanet_db
    environment:
      POSTGRES_USER: rouanet
      POSTGRES_PASSWORD: rouanet_dev_password
      POSTGRES_DB: rouanet_concilia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rouanet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rouanet_network

  # FastAPI backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rouanet_backend
    environment:
      DATABASE_URL: postgresql://rouanet:rouanet_dev_password@postgres:5432/rouanet_concilia
      SUPABASE_JWT_SECRET: "dev-secret-key-min-32-chars-long-!!!"
      APP_ENV: dev
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      UPLOAD_DIR: /app/uploads
      PYTHONUNBUFFERED: 1
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL_ID: ${OLLAMA_MODEL_ID:-qwen2.5-coder:7b}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./motor:/app/motor
      - ./db:/app/db:ro
      - uploads:/app/uploads
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - rouanet_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads:

networks:
  rouanet_network:
    driver: bridge
